<title>もじカズ たんけんたい</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#E7EFF3; --bg2:#D7E6ED;
  --surface:#FFFFFF; --surface2:#F2F8FA; --sunk:#DCEAF0;
  --ink:#12222C; --ink2:#4E6675; --ink3:#7D95A3;
  --line:#C6DAE3; --line2:#A9C6D3;
  --accent:#EF5F28; --accent2:#FF8A4C; --on-accent:#FFFFFF;
  --good:#1B9E68; --good-bg:#DCF3E8;
  --bad:#D93B31; --bad-bg:#FBE2E0;
  --gold:#E39A0C;
  --shadow:0 2px 0 var(--line2);
  --shadow-lift:0 6px 0 var(--line2);
  --r-s:12px; --r-m:20px; --r-l:28px;
  --sil:brightness(0) opacity(.18);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1820; --bg2:#08131A;
    --surface:#152731; --surface2:#1B3541; --sunk:#0F202A;
    --ink:#E8F2F6; --ink2:#A2BAC6; --ink3:#7794A3;
    --line:#27444F; --line2:#1B333D;
    --accent:#FF7A45; --accent2:#FF9C6B; --on-accent:#1A0A03;
    --good:#3ECB8E; --good-bg:#123528;
    --bad:#FF7167; --bad-bg:#3A1A18;
    --gold:#FFC24D;
    --shadow:0 2px 0 #0A171E; --shadow-lift:0 6px 0 #0A171E;
    --sil:brightness(0) invert(1) opacity(.22);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1820; --bg2:#08131A;
  --surface:#152731; --surface2:#1B3541; --sunk:#0F202A;
  --ink:#E8F2F6; --ink2:#A2BAC6; --ink3:#7794A3;
  --line:#27444F; --line2:#1B333D;
  --accent:#FF7A45; --accent2:#FF9C6B; --on-accent:#1A0A03;
  --good:#3ECB8E; --good-bg:#123528;
  --bad:#FF7167; --bad-bg:#3A1A18;
  --gold:#FFC24D;
  --shadow:0 2px 0 #0A171E; --shadow-lift:0 6px 0 #0A171E;
  --sil:brightness(0) invert(1) opacity(.22);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",-apple-system,sans-serif;
  font-weight:700;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
.num{font-family:"Fredoka",system-ui,sans-serif;font-variant-numeric:tabular-nums}
img.spr{width:100%;height:100%;object-fit:contain;display:block;image-rendering:pixelated;-webkit-user-drag:none}

#app{
  height:100dvh;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  max-width:900px;margin:0 auto;position:relative;
}
.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- ホーム ---------- */
.home-top{padding:18px 20px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{line-height:1.05}
.brand b{display:block;font-size:clamp(26px,6.4vw,38px);font-weight:900;letter-spacing:.01em}
.brand span{display:block;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.16em;margin-top:4px}
.streak{
  display:flex;align-items:center;gap:7px;background:var(--surface);border:2px solid var(--line);
  border-radius:999px;padding:7px 14px;box-shadow:var(--shadow);white-space:nowrap;
}
.streak .n{font-size:20px;font-weight:700;color:var(--accent)}
.streak .lbl{font-size:11px;color:var(--ink2);line-height:1.25}

.home-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 20px 20px}
.section-label{font-size:11px;letter-spacing:.18em;color:var(--ink3);margin:20px 0 10px}
.section-label:first-child{margin-top:6px}

.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.area{
  position:relative;background:var(--surface);border:3px solid var(--line);border-radius:var(--r-l);
  padding:14px 16px;text-align:left;box-shadow:var(--shadow-lift);
  transition:transform .1s,box-shadow .1s;overflow:hidden;
  display:flex;align-items:center;gap:12px;
}
.area:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line2)}
.area.wide{grid-column:1/-1}
.area .ic{width:56px;height:56px;flex:none;position:relative;z-index:1}
.area .tx{position:relative;z-index:1;min-width:0}
.area h3{margin:0;font-size:clamp(18px,4.4vw,22px);font-weight:900}
.area p{margin:3px 0 0;font-size:12px;color:var(--ink2);font-weight:500;line-height:1.5}
.area .glow{position:absolute;inset:auto -26px -34px auto;width:110px;height:110px;border-radius:50%;opacity:.16;z-index:0}

.lv-row{display:flex;gap:10px}
.lv{
  flex:1;background:var(--surface);border:3px solid var(--line);border-radius:var(--r-m);
  padding:12px 6px;text-align:center;box-shadow:var(--shadow);
}
.lv .st{font-size:17px;color:var(--gold);letter-spacing:1px}
.lv .nm{font-size:13px;margin-top:2px;color:var(--ink2)}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2)}
.lv[aria-pressed="true"] .nm{color:var(--accent)}

.mini-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mini{
  background:var(--surface);border:3px solid var(--line);border-radius:var(--r-m);
  padding:13px 8px;text-align:center;box-shadow:var(--shadow);font-size:14px;
}
.mini .mi{font-size:22px;display:block;line-height:1.2}
.mini .mn{display:block;margin-top:3px}
.mini:active{transform:translateY(2px);box-shadow:none}

/* ---------- あそぶ ---------- */
.play-top{padding:10px 16px 4px;display:flex;align-items:center;gap:10px}
.icon-btn{
  width:44px;height:44px;border-radius:14px;background:var(--surface);border:2px solid var(--line);
  display:grid;place-items:center;font-size:17px;flex:none;box-shadow:var(--shadow);
}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.pips{flex:1;display:flex;gap:5px;align-items:center;justify-content:center}
.pip{width:100%;max-width:34px;height:9px;border-radius:99px;background:var(--sunk);border:1px solid var(--line)}
.pip.done{background:var(--accent);border-color:var(--accent)}
.pip.cur{background:var(--accent2);border-color:var(--accent2)}
.clock-mini{font-size:13px;color:var(--ink3);min-width:44px;text-align:right}

.stage{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 16px 6px;position:relative}
.mon-wrap{position:relative;width:clamp(112px,24vh,160px);height:clamp(112px,24vh,160px)}
.mon-wrap.idle img{animation:bob 2.4s ease-in-out infinite}
.mon-wrap.hit img{animation:hit .38s ease-out}
.mon-wrap.caught img{animation:suck .7s ease-in forwards}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes hit{0%{transform:scale(1)}25%{transform:scale(1.1) rotate(5deg)}60%{transform:scale(.93) rotate(-4deg)}100%{transform:scale(1)}}
@keyframes suck{0%{transform:scale(1);opacity:1}70%{transform:scale(.25) translateY(6px);opacity:.55}100%{transform:scale(0);opacity:0}}
.shiny-mark{position:absolute;top:-2px;right:-2px;font-size:20px;animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:.85}50%{transform:scale(1.25) rotate(15deg);opacity:1}}
.ball{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;opacity:0;z-index:5}
.ball svg{width:100%;height:100%;display:block}
.ball.go{animation:ballthrow 1.7s ease-out forwards}
@keyframes ballthrow{
  0%{opacity:0;transform:translate(-110px,80px) scale(.4) rotate(0deg)}
  18%{opacity:1;transform:translate(0,0) scale(1) rotate(720deg)}
  30%{transform:translate(0,0) scale(1) rotate(720deg)}
  40%{transform:translate(-7px,0) rotate(704deg)}
  50%{transform:translate(7px,0) rotate(736deg)}
  60%{transform:translate(-6px,0) rotate(706deg)}
  70%{transform:translate(6px,0) rotate(734deg)}
  80%,100%{opacity:1;transform:translate(0,0) scale(1) rotate(720deg)}
}
.mon-name{margin-top:4px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.tchip{font-size:10.5px;padding:2px 9px;border-radius:99px;color:#fff;font-weight:700}
.hearts{display:flex;gap:5px;margin-top:6px}
.heart{width:15px;height:15px;border-radius:50%;background:var(--sunk);border:2px solid var(--line2)}
.heart.full{background:var(--good);border-color:var(--good)}

.qbox{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 18px;gap:8px;text-align:center}
.q-kind{font-size:11px;letter-spacing:.14em;color:var(--ink3)}
.q-text{font-size:clamp(21px,5.6vw,31px);font-weight:900;line-height:1.5;max-width:20ch;text-wrap:balance;word-break:keep-all}
.q-calc{font-size:clamp(38px,11vw,62px);font-weight:700;letter-spacing:.02em}
.q-sub{font-size:13px;color:var(--ink2);font-weight:500;line-height:1.5;max-width:24ch}
.q-art{max-width:min(230px,58vw);max-height:18vh;color:var(--ink)}
.q-art svg{width:100%;height:100%;display:block}

.answers{flex:none;padding:6px 14px calc(12px + env(safe-area-inset-bottom));display:grid;gap:9px}
.answers.g3{grid-template-columns:repeat(3,1fr)}
.answers.g2{grid-template-columns:1fr 1fr}
.answers.g1{grid-template-columns:1fr}
.ans{
  background:var(--surface);border:3px solid var(--line);border-radius:var(--r-m);
  min-height:64px;padding:10px 12px;font-size:clamp(18px,4.6vw,23px);font-weight:900;
  box-shadow:var(--shadow-lift);display:grid;place-items:center;line-height:1.3;
  transition:transform .08s,box-shadow .08s;
}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line2)}
.ans.ok{background:var(--good-bg);border-color:var(--good);color:var(--good);box-shadow:0 6px 0 var(--good);animation:pop .3s}
.ans.ng{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);box-shadow:0 6px 0 var(--bad);animation:shake .3s}
.ans.dim{opacity:.4}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad .k{background:var(--surface);border:3px solid var(--line);border-radius:16px;min-height:56px;font-size:26px;font-weight:700;box-shadow:var(--shadow-lift);display:grid;place-items:center}
.pad .k:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line2)}
.pad .k.act{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 6px 0 #00000022;font-size:19px}
.pad .k.del{font-size:19px;color:var(--ink2)}
.entry{grid-column:1/-1;background:var(--sunk);border:3px dashed var(--line2);border-radius:16px;min-height:60px;display:grid;place-items:center;font-size:34px;font-weight:700;letter-spacing:.08em}
.entry.empty{color:var(--ink3)}
.entry.ok{background:var(--good-bg);border-color:var(--good);border-style:solid;color:var(--good)}
.entry.ng{background:var(--bad-bg);border-color:var(--bad);border-style:solid;color:var(--bad);animation:shake .3s}

.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);padding:14px 30px;border-radius:99px;font-size:26px;font-weight:900;pointer-events:none;z-index:40;opacity:0;white-space:nowrap;box-shadow:0 8px 24px #0003}
.toast.show{animation:toast 1s ease-out}
.toast.g{background:var(--good);color:#fff}
.toast.b{background:var(--bad);color:#fff}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

.banner{position:absolute;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.banner .big{font-size:clamp(22px,5.6vw,30px);font-weight:900;line-height:1.45;text-wrap:balance}
.banner .sm{font-size:14px;color:var(--ink2);font-weight:500}
.banner .art{width:min(180px,46vw);height:min(180px,46vw);position:relative}
.banner .art img{animation:appear .5s cubic-bezier(.2,1.5,.5,1)}
@keyframes appear{0%{transform:scale(.3) translateY(30px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.banner.evo .art img{animation:evolve 1.2s ease-out}
@keyframes evolve{0%{filter:brightness(0) invert(1);transform:scale(.55)}20%{filter:brightness(0) invert(1)}55%{filter:brightness(0) invert(1);transform:scale(1.2)}100%{filter:none;transform:scale(1)}}
.newtag{background:var(--gold);color:#2A1B00;font-size:12px;padding:4px 14px;border-radius:99px;letter-spacing:.1em}
.newtag.sh{background:linear-gradient(90deg,#FFD24D,#FF8FD0,#7FD8FF);color:#2A1B00}
.newtag.lg{background:var(--accent);color:var(--on-accent)}

/* ---------- けっか ---------- */
.res-body{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px}
.res-hero{text-align:center;padding:6px 0 2px}
.res-hero .h{font-size:clamp(25px,6.6vw,34px);font-weight:900}
.res-hero .s{font-size:13.5px;color:var(--ink2);font-weight:500;margin-top:4px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:3px solid var(--line);border-radius:var(--r-m);padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.stat .v{font-size:28px;font-weight:700;line-height:1}
.stat .k{font-size:11px;color:var(--ink3);margin-top:5px}
.got{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.got .card{width:98px;background:var(--surface);border:3px solid var(--line);border-radius:var(--r-m);padding:8px 4px;text-align:center;box-shadow:var(--shadow);position:relative}
.got .card .ph{width:60px;height:60px;margin:0 auto}
.got .card .n{font-size:11.5px;margin-top:2px}
.weak{background:var(--surface);border:3px solid var(--line);border-radius:var(--r-m);padding:14px 16px;box-shadow:var(--shadow)}
.weak h4{margin:0 0 8px;font-size:13px;color:var(--ink3);letter-spacing:.1em;font-weight:700}
.weak ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.weak li{display:flex;align-items:center;gap:9px;font-size:14px}
.bar{flex:1;height:9px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.bar i.low{background:var(--accent)}
.weak li .pc{font-size:12px;color:var(--ink2);width:38px;text-align:right}

.cta-row{display:flex;gap:10px;padding:0 20px calc(16px + env(safe-area-inset-bottom))}
.cta{flex:1;min-height:62px;border-radius:var(--r-m);font-size:19px;font-weight:900;background:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 #00000030;display:grid;place-items:center}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #00000030}
.cta.ghost{background:var(--surface);color:var(--ink);border:3px solid var(--line);box-shadow:var(--shadow-lift);flex:0 0 34%}

/* ---------- ずかん ---------- */
.hdr{padding:14px 18px 8px;display:flex;align-items:center;gap:12px}
.hdr h2{margin:0;font-size:22px;font-weight:900;flex:1}
.hdr .cnt{font-size:13px;color:var(--ink2)}
.dex-grid{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px 18px calc(20px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px;align-content:start;
}
.dcard{background:var(--surface);border:3px solid var(--line);border-radius:var(--r-m);padding:16px 4px 7px;text-align:center;box-shadow:var(--shadow);position:relative}
.dcard .ph{width:100%;aspect-ratio:1}
.dcard .n{font-size:11px;margin-top:1px;line-height:1.25}
.dcard .ty{font-size:9.5px;margin-top:2px;line-height:1.3}
.dcard .no{position:absolute;top:5px;left:7px;font-size:10px;color:var(--ink3)}
.dcard .cn{position:absolute;top:5px;right:7px;font-size:10px;color:var(--accent)}
.dcard .sh{position:absolute;top:20px;right:6px;font-size:13px}
.dcard.locked{background:var(--sunk);border-style:dashed}
.dcard.locked img{filter:var(--sil)}
.dcard.locked .n{color:var(--ink3)}

/* ---------- きろく ---------- */
.log-body{flex:1;min-height:0;overflow-y:auto;padding:6px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{aspect-ratio:1;border-radius:10px;background:var(--sunk);border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--ink3)}
.cal .d.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:3px solid var(--line);border-radius:var(--r-m);padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.row .dt{font-size:13px;width:52px;color:var(--ink2)}
.row .tg{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.row .sc{margin-left:auto;font-size:16px;font-weight:700}
.empty-note{text-align:center;color:var(--ink3);font-size:14px;font-weight:500;padding:36px 20px;line-height:1.7}

.set-list{display:flex;flex-direction:column;gap:9px}
.set{background:var(--surface);border:3px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.set .lb{flex:1;font-size:15px}
.set .lb small{display:block;font-size:11.5px;color:var(--ink3);font-weight:500;margin-top:2px}
.sw{width:60px;height:34px;border-radius:99px;background:var(--sunk);border:2px solid var(--line2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px #0003;transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.sw[aria-pressed="true"]::after{transform:translateX(26px)}

.sync{position:absolute;right:14px;bottom:calc(6px + env(safe-area-inset-bottom));font-size:10px;color:var(--ink3);opacity:.7}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
@media (min-height:760px){
  .mon-wrap{width:clamp(140px,26vh,190px);height:clamp(140px,26vh,190px)}
  .ans{min-height:74px}
  .pad .k{min-height:64px}
}
@media (max-height:640px){
  .stage{flex-direction:row;gap:16px;padding-top:0}
  .mon-wrap{width:92px;height:92px}
  .mon-name,.hearts{margin-top:0}
  .ans{min-height:54px;font-size:19px}
  .pad .k{min-height:46px;font-size:22px}
  .entry{min-height:48px;font-size:28px}
  .q-calc{font-size:clamp(30px,7vw,44px)}
  .ball{width:44px;height:44px;margin:-22px 0 0 -22px}
}
</style>

<div id="app">
  <!-- ホーム -->
  <section class="screen on" id="s-home">
    <div class="home-top">
      <div class="brand"><b>もじカズ たんけんたい</b><span>MOJIKAZU EXPEDITION</span></div>
      <div class="streak"><span class="n num" id="streakN">0</span><span class="lbl">にち<br>れんぞく</span></div>
    </div>
    <div class="home-body">
      <div class="section-label">どこへ いく？</div>
      <div class="areas">
        <button class="area wide" data-go="kokugo">
          <span class="glow" style="background:#3E9E4E"></span>

<script>
"use strict";
/* =========================================================
   もじカズ たんけんたい
   1ねんせい むけ こくご・さんすう ドリル（かんじ なし）
   ポケモンの データと えは PokeAPI (pokeapi.co) から
   ビルドじに とりこんで います。
   ========================================================= */

const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1);[b[i], b[j]] = [b[j], b[i]]; } return b; };
const uniq = a => [...new Set(a)];

/* ---------------------------------------------------------
   1. ポケモン
   --------------------------------------------------------- */
const MON = {}; PK.forEach(p => { MON[p.i] = p; });
const BASES = PK.filter(p => p.st === 0 && !p.L);   // やせいで であう ポケモン
const LEGEND = PK.filter(p => p.L);                 // でんせつ
const SHINY_ODDS = 45, LEGEND_ODDS = 70;

const TCOL = {
  'ノーマル':'#7F857D','ほのお':'#DE5B33','みず':'#3A80D4','でんき':'#B8900A','くさ':'#3E9E4E',
  'こおり':'#2F97A6','かくとう':'#B8422F','どく':'#94499E','じめん':'#A2742A','ひこう':'#5B76CE',
  'エスパー':'#D33F69','むし':'#6D9A1E','いわ':'#8A6740','ゴースト':'#6A50A0','ドラゴン':'#5A48BA',
  'はがね':'#5A7A87','フェアリー':'#CC5A93',
};
const tcol = t => TCOL[t] || '#7F857D';
const dexNo = id => String(id).padStart(3, '0');

function sprHTML(p, shiny) {
  const b64 = (shiny && p.y) ? p.y : p.s;
  return `<img class="spr" src="data:image/png;base64,${b64}" alt="${p.n}" draggable="false">`;
}
function typeChips(p) { return p.t.map(t => `<span class="tchip" style="background:${tcol(t)}">${t}</span>`).join(''); }

const BALL_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="45" fill="#F4F6F6" stroke="#17232B" stroke-width="6"/>
  <path d="M5 50a45 45 0 0 1 90 0Z" fill="#E23B34"/>
  <rect x="5" y="44" width="90" height="12" fill="#17232B"/>
  <circle cx="50" cy="50" r="15" fill="#FFF" stroke="#17232B" stroke-width="6"/>
  <circle cx="50" cy="50" r="6" fill="#D7E0E5" stroke="#17232B" stroke-width="3"/></svg>`;

/* しんか：おなじ チェーンを 3かい / 6かい つかまえると すがたが かわる */
function chooseEvo(list) {
  return list.slice().sort((a, b) => ((S.mons[a] || 0) - (S.mons[b] || 0)) || (a - b))[0];
}
function formFor(base) {
  const c = S.chain[base.i] || 0;
  const steps = c >= 6 ? 2 : c >= 3 ? 1 : 0;
  let cur = base;
  for (let k = 0; k < steps; k++) {
    if (!cur.e || !cur.e.length) break;
    const nx = MON[chooseEvo(cur.e)];
    if (!nx) break;
    cur = nx;
  }
  return cur;
}
function rollEncounter(used) {
  if (rnd(LEGEND_ODDS) === 0) {
    const free = LEGEND.filter(p => !used.has(p.i));
    if (free.length) { const l = pick(free); return { p:l, baseId:l.i, shiny: rnd(SHINY_ODDS) === 0, legend:true }; }
  }
  let base = null;
  const free = BASES.filter(p => !used.has(p.i));
  base = free.length ? pick(free) : pick(BASES);
  return { p: formFor(base), baseId: base.i, shiny: rnd(SHINY_ODDS) === 0, legend:false };
}

/* ---------------------------------------------------------
   2. もんだい（かんじ なし）
   --------------------------------------------------------- */
const KIND = {
  add10:'たしざん', sub10:'ひきざん', make10:'いくつと いくつ',
  addC:'くりあがりの たしざん', subB:'くりさがりの ひきざん',
  three:'3つの かず', compare:'おおきさ くらべ', clock:'とけい',
  word:'ぶんしょうだい', order:'かずの ならび', tens:'10の まとまり',
  dakuon:'てんてん・まる', youon:'ちいさい ゃゅょ', sokuon:'ちいさい っ',
  chouon:'のばす おと', kata:'かたかな', nakama:'なかまの ことば',
  hantai:'はんたいの ことば', joshi:'は・を・へ', kazoe:'かぞえかた',
  shiri:'しりとり', onsuu:'おとの かず', tsukuri:'ことば づくり',
};

/* --- さんすう --- */
const G = {};
G.add10 = () => { const a = 1 + rnd(8); const b = 1 + rnd(9 - a); return calcQ('add10', `${a} + ${b}`, a + b); };
G.sub10 = () => { const a = 3 + rnd(8); const b = 1 + rnd(a - 1); return calcQ('sub10', `${a} - ${b}`, a - b); };
G.make10 = () => { const t = pick([10, 10, 10, 8, 9]); const a = 1 + rnd(t - 1);
  return { kind:'make10', mode:'pad', text:`${t}は ${a}と いくつ？`, answer:t - a }; };
G.addC = () => { let a, b; do { a = 4 + rnd(6); b = 4 + rnd(6); } while (a + b < 11 || a + b > 18); return calcQ('addC', `${a} + ${b}`, a + b); };
G.subB = () => { const a = 11 + rnd(8); let b; do { b = 2 + rnd(8); } while (a - b < 2 || a - b > 9); return calcQ('subB', `${a} - ${b}`, a - b); };
G.three = () => {
  if (rnd(2)) { const a = 1 + rnd(4), b = 1 + rnd(4), c = 1 + rnd(4); return calcQ('three', `${a} + ${b} + ${c}`, a + b + c); }
  const a = 6 + rnd(8), b = 1 + rnd(4), c = 1 + rnd(Math.min(4, a + b - 1));
  return calcQ('three', `${a} + ${b} - ${c}`, a + b - c);
};
G.tens = () => {
  const t = 1 + rnd(9), o = 1 + rnd(9);
  if (rnd(2)) return { kind:'tens', mode:'pad', text:`10が ${t}こと 1が ${o}こで いくつ？`, answer:t * 10 + o };
  return { kind:'tens', mode:'pad', text:`${t * 10 + o}は 10が ${t}こと 1が なんこ？`, answer:o };
};
G.compare = (lv) => {
  const max = lv >= 3 ? 100 : lv === 2 ? 20 : 10;
  let a = rnd(max) + 1, b = rnd(max) + 1; while (a === b) b = rnd(max) + 1;
  return { kind:'compare', mode:'choice', text:'おおきいのは どっち？', big:true,
           choices: shuffle([String(a), String(b)]), answer: String(Math.max(a, b)) };
};
G.order = () => {
  const st = rnd(2) ? 1 + rnd(12) : 2 + rnd(14), step = rnd(3) === 0 ? 2 : 1, dir = rnd(4) === 0 ? -1 : 1;
  const seq = [0,1,2,3].map(i => st + dir * step * i);
  if (seq.some(n => n < 0)) return G.order();
  const hole = 1 + rnd(3);
  return { kind:'order', mode:'pad', text:'□に はいる かずは？',
           sub: seq.map((n, i) => i === hole ? '□' : n).join(' , '), answer: seq[hole] };
};
G.clock = (lv) => {
  const h = 1 + rnd(12); const half = lv >= 2 ? rnd(2) : 0;
  const label = half ? `${h}じはん` : `${h}じ`;
  const wrong = uniq(shuffle([`${(h % 12) + 1}じ`, `${((h + 10) % 12) + 1}じ`, `${h}じはん`, `${h}じ`, `${(h % 12) + 1}じはん`]).filter(x => x !== label)).slice(0, 3);
  return { kind:'clock', mode:'choice', text:'なんじ？', art: clockSVG(h, half ? 30 : 0),
           choices: shuffle([label, ...wrong]), answer: label };
};
function clockSVG(h, min) {
  let ticks = '';
  for (let i = 1; i <= 12; i++) {
    const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
    ticks += `<text x="${(50 + Math.cos(a) * 36).toFixed(1)}" y="${(50 + Math.sin(a) * 36 + 4.5).toFixed(1)}" font-size="12" font-family="Fredoka,sans-serif" text-anchor="middle" fill="currentColor">${i}</text>`;
  }
  const ha = ((h % 12) + min / 60) / 12 * Math.PI * 2 - Math.PI / 2;
  const ma = (min / 60) * Math.PI * 2 - Math.PI / 2;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="とけい">
    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="4"/>${ticks}
    <line x1="50" y1="50" x2="${(50 + Math.cos(ha) * 22).toFixed(1)}" y2="${(50 + Math.sin(ha) * 22).toFixed(1)}" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="${(50 + Math.cos(ma) * 32).toFixed(1)}" y2="${(50 + Math.sin(ma) * 32).toFixed(1)}" stroke="#EF5F28" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="4" fill="currentColor"/></svg>`;
}
const WORDN = [['あめ','こ'],['りんご','こ'],['どんぐり','こ'],['はな','ほん'],['くるま','だい'],['ねこ','ひき'],['さかな','ひき'],['ほん','さつ'],['シール','まい'],['たまご','こ']];
G.word = (lv) => {
  const [n, c] = pick(WORDN); const k = rnd(3);
  if (k === 0) { const a = 2 + rnd(6), b = 1 + rnd(lv >= 2 ? 8 : 10 - a);
    return { kind:'word', mode:'pad', text:`${n}が ${a}${c} あります。${b}${c} もらいました。ぜんぶで なん${c}？`, answer:a + b }; }
  if (k === 1) { const a = 5 + rnd(lv >= 2 ? 10 : 5), b = 1 + rnd(a - 1);
    return { kind:'word', mode:'pad', text:`${n}が ${a}${c} あります。${b}${c} たべました。のこりは なん${c}？`, answer:a - b }; }
  const a = 3 + rnd(8), d = 1 + rnd(4);
  return { kind:'word', mode:'pad', text:`あかい ${n}が ${a}${c}、しろい ${n}が ${a + d}${c} あります。しろいほうが なん${c} おおい？`, answer:d };
};
function calcQ(kind, expr, answer) { return { kind, mode:'pad', calc:expr, answer }; }

/* --- こくご --- */
const DAKU = [['か','が'],['き','ぎ'],['く','ぐ'],['け','げ'],['こ','ご'],['さ','ざ'],['し','じ'],['す','ず'],['た','だ'],['ち','ぢ'],['つ','づ'],['て','で'],['と','ど'],['は','ば'],['ひ','び'],['ふ','ぶ'],['へ','べ'],['ほ','ぼ']];
const HANDAKU = [['は','ぱ'],['ひ','ぴ'],['ふ','ぷ'],['へ','ぺ'],['ほ','ぽ']];
G.dakuon = () => {
  if (rnd(4) === 0) { const [a, b] = pick(HANDAKU);
    return { kind:'dakuon', mode:'choice', text:`「${a}」に まる（゜）を つけると？`, big:true,
             choices: shuffle(uniq([b, DAKU.find(d => d[0] === a)[1], a, pick(HANDAKU)[1]])).slice(0, 4), answer:b }; }

function ac() { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function beep(notes, type) {
  if (!S.sound) return; const c = ac(); if (!c) return;
  notes.forEach((n, i) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = n.f;
    const t0 = c.currentTime + (n.t != null ? n.t : i * 0.09);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (n.d || 0.18));
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + (n.d || 0.18) + 0.05);
  });
}

function judge(val, btn) {

  R.asked++;

      for (let i = 0; i < h.length; i++) h[i].classList.toggle('full', i < R.hp);
      art.classList.remove('hit'); art.classList.add('idle');
    }, 380);
    setTimeout(() => { if (R.hp <= 0) doCatch(); else nextQ(); }, 900);
  } else {
    SFX.ng(); toast('おしいっ', false);
    if (btn) {
      btn.classList.add('ng');
      document.querySelectorAll('#answers .ans').forEach(b => {
        if (b.dataset.c === String(q.answer)) b.classList.add('ok'); else if (b !== btn) b.classList.add('dim');
      });
    } else { const e = $('#entry'); if (e) { e.classList.add('ng'); setTimeout(() => { e.textContent = String(q.answer); }, 450); } }
    if (!R.wrongQ.some(x => x.sig === q.sig)) R.wrongQ.push(q);
    setTimeout(nextQ, 2200);
  }
  save();
}

function doCatch() {
  const e = cur(), p = e.p;
  const art = $('#monArt');
  SFX.throw_();
  const ball = document.createElement('div');
  ball.className = 'ball go'; ball.innerHTML = BALL_SVG;
  art.appendChild(ball);
  setTimeout(() => { art.classList.remove('idle'); art.classList.add('caught'); }, 300);

  setTimeout(() => {
    SFX.catch_();
    const before = S.mons[p.i] || 0;
    S.mons[p.i] = before + 1;
    S.chain[e.baseId] = (S.chain[e.baseId] || 0) + 1;
    if (e.shiny) S.shiny[p.i] = 1;
    R.caught.push({ id:p.i, isNew: before === 0, shiny: !!e.shiny });
    save();

    const tag = before === 0 ? '<div class="newtag">ずかんに とうろく！</div>' : '';
    banner(`<div class="art">${sprHTML(p, e.shiny)}</div>${tag}<div class="big">${p.n}を<br>つかまえた！</div>`, 1900)
      .then(() => {
        const next = formFor(MON[e.baseId]);
        if (!e.legend && next.i !== p.i) {
          SFX.evo();
          S.mons[next.i] = Math.max(S.mons[next.i] || 0, 1);
          R.evolved.push(next.i); save();
          return banner(`<div class="art">${sprHTML(next)}</div><div class="newtag">おめでとう！</div><div class="big">${p.n}は<br>${next.n}に しんかした！</div>`, 2500, 'evo');
        }
      })
      .then(() => {
        R.idx++;
        if (R.idx >= R.roster.length) finish(); else meet();
      });
  }, 1750);
}

function finish() {
  if (R.ended) return;
  R.ended = true; clearInterval(clockT); SFX.done();
  const secs = Math.round((Date.now() - R.t0) / 1000);
  const d = today();
  if (!S.days.includes(d)) S.days.push(d);
  S.days = S.days.slice(-400);
  S.runs.push({ d, area:R.area, lv:R.lv, asked:R.asked, right:R.right, secs, got:R.caught.map(c => c.id) });
  S.runs = S.runs.slice(-60);
  save();
  renderResult(secs);
  show('res');
}
function quitRun() {
  if (!R || R.ended) { show('home'); return; }
  if (R.asked === 0) { R.ended = true; clearInterval(clockT); show('home'); return; }
  finish();
}

/* ---------------------------------------------------------
   7. けっか
   --------------------------------------------------------- */
const AREA_NAME = { kokugo:'ことばの もり', sansu:'かずの みずうみ', mix:'まざりの どうくつ' };
function renderResult(secs) {
  const pct = R.asked ? Math.round(R.right / R.asked * 100) : 0;
  const mins = Math.floor(secs / 60), ss = String(secs % 60).padStart(2, '0');
  const head = pct >= 90 ? 'かんぺき！' : pct >= 70 ? 'よく できました！' : pct >= 50 ? 'がんばったね！' : 'さいごまで やりきった！';
  const kinds = Object.entries(R.kinds).sort((a, b) => (a[1].c / a[1].a) - (b[1].c / b[1].a));

  let h = `<div class="res-hero"><div class="h">${head}</div><div class="s">${AREA_NAME[R.area]}・${'★'.repeat(R.lv)}</div></div>
  <div class="stats3">
    <div class="stat"><div class="v num">${R.right}<span style="font-size:15px;color:var(--ink3)">/${R.asked}</span></div><div class="k">せいかい</div></div>
    <div class="stat"><div class="v num">${pct}<span style="font-size:15px;color:var(--ink3)">%</span></div><div class="k">せいかいりつ</div></div>
    <div class="stat"><div class="v num">${mins}:${ss}</div><div class="k">じかん</div></div>
  </div>`;

  if (R.caught.length || R.evolved.length) {
    h += `<div class="section-label" style="margin:6px 0 0">つかまえた ポケモン</div><div class="got">`
      + R.caught.map(c => `<div class="card"><div class="ph">${sprHTML(MON[c.id], c.shiny)}</div><div class="n">${MON[c.id].n}${c.shiny ? ' ✨' : ''}</div></div>`).join('')
      + R.evolved.map(id => `<div class="card" style="border-color:var(--gold)"><div class="ph">${sprHTML(MON[id])}</div><div class="n">${MON[id].n}</div></div>`).join('')
      + `</div>`;
  }
  if (kinds.length) {
    h += `<div class="weak"><h4>きょう やった もんだい</h4><ul>`
      + kinds.map(([k, v]) => { const p = Math.round(v.c / v.a * 100);
          return `<li><span style="width:8.5em;font-size:13px">${KIND[k]}</span><span class="bar"><i class="${p < 70 ? 'low' : ''}" style="width:${p}%"></i></span><span class="pc num">${p}%</span></li>`; }).join('')
      + `</ul></div>`;
  }
  $('#resBody').innerHTML = h;
}

/* ---------------------------------------------------------
   8. ずかん
   --------------------------------------------------------- */
function renderDex() {
  const owned = PK.filter(p => S.mons[p.i]).length;
  $('#dexCnt').textContent = `${owned} / ${PK.length}`;
  $('#dexGrid').innerHTML = PK.map(p => {
    const n = S.mons[p.i] || 0;
    if (!n) return `<div class="dcard locked"><span class="no num">${dexNo(p.i)}</span><div class="ph">${sprHTML(p)}</div><div class="n">？？？</div></div>`;
    return `<div class="dcard"><span class="no num">${dexNo(p.i)}</span><span class="cn num">×${n}</span>${S.shiny[p.i] ? '<span class="sh">✨</span>' : ''}
      <div class="ph">${sprHTML(p, !!S.shiny[p.i])}</div><div class="n">${p.n}</div>
      <div class="ty">${p.t.map(t => `<span style="color:${tcol(t)}">${t}</span>`).join(' ')}</div></div>`;
  }).join('');
}

/* ---------------------------------------------------------
   9. きろく
   --------------------------------------------------------- */
function renderLog() {
  const set = new Set(S.days);
  let cal = '';
  for (let i = 27; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    cal += `<div class="d${set.has(dkey(d)) ? ' on' : ''}"><span class="num">${d.getDate()}</span></div>`;
  }
  let h = `<div class="section-label" style="margin:4px 0 0">この 4しゅうかん</div><div class="cal">${cal}</div>`;

  const ks = Object.entries(S.kinds).filter(([, v]) => v.a >= 4).sort((a, b) => (a[1].c / a[1].a) - (b[1].c / b[1].a));
  if (ks.length) {
    h += `<div class="weak"><h4>とくいと にがて（ぜんぶの きろく）</h4><ul>`
      + ks.map(([k, v]) => { const p = Math.round(v.c / v.a * 100);
          return `<li><span style="width:8.5em;font-size:13px">${KIND[k]}</span><span class="bar"><i class="${p < 70 ? 'low' : ''}" style="width:${p}%"></i></span><span class="pc num">${p}%</span></li>`; }).join('')
      + `</ul></div>`;
  }
  const runs = S.runs.slice().reverse().slice(0, 20);
  h += `<div class="section-label" style="margin:6px 0 0">これまでの たんけん</div>`;
  h += runs.length
    ? `<div class="rows">` + runs.map(r => {
        const p = r.asked ? Math.round(r.right / r.asked * 100) : 0;
        const [, mo, da] = r.d.split('-');
        return `<div class="row"><span class="dt num">${+mo}/${+da}</span><span class="tg">${AREA_NAME[r.area] || r.area}</span><span class="tg">${'★'.repeat(r.lv || 1)}</span><span class="sc num">${p}%</span></div>`;
      }).join('') + `</div>`
    : `<div class="empty-note">まだ きろくが ないよ。<br>ホームから たんけんに いこう！</div>`;
  $('#logBody').innerHTML = h;
}

/* ---------------------------------------------------------
   10. せってい
   --------------------------------------------------------- */
function renderSet() {
  $('#swSound').setAttribute('aria-pressed', String(!!S.sound));
  document.querySelectorAll('#lenRow .mini').forEach(b => {
    const on = +b.dataset.len === S.rounds;
    b.style.borderColor = on ? 'var(--accent)' : 'var(--line)';
    b.style.color = on ? 'var(--accent)' : '';
  });
}

/* ---------------------------------------------------------
   11. イベント
   --------------------------------------------------------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-scr],[data-go],[data-lv],[data-c],[data-d],[data-len]');
  if (!t) return;
  if (t.dataset.scr) { unlockAudio(); show(t.dataset.scr); return; }
  if (t.dataset.go) { startRun(t.dataset.go); return; }
  if (t.dataset.lv) { S.lv = +t.dataset.lv; save(); renderHome(); SFX.tap(); return; }
  if (t.dataset.len) { S.rounds = +t.dataset.len; save(); renderSet(); SFX.tap(); return; }
  if (t.dataset.d) { padPress(t.dataset.d); return; }
  if (t.dataset.c !== undefined) { judge(t.dataset.c, t); return; }
});
$('#btnQuit').addEventListener('click', quitRun);
$('#btnAgain').addEventListener('click', () => startRun(S.area));
$('#swSound').addEventListener('click', () => { S.sound = !S.sound; save(); renderSet(); if (S.sound) { unlockAudio(); SFX.ok(); } });
$('#btnReset').addEventListener('click', () => {
  if (!confirm('きろくを ぜんぶ けしますか？')) return;
  S = blank(); save(); show('home');
});
document.addEventListener('gesturestart', ev => ev.preventDefault());

/* ---------------------------------------------------------
   12. スタート
   --------------------------------------------------------- */
load();
renderHome();
initCloud();
</script>
